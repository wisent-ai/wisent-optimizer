name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. The contract of this package is what it promises callers: the names its
# package initialisers re-export, and the `optimization_type` strings its dispatch
# accepts. Adding one is a capability; removing or renaming one breaks whoever called
# it yesterday, and in the dispatch case breaks them silently.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the three
# things this repository alone knows: its surface, the version it declares, and the
# published artifact its baseline was recovered from.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: wisent-optimizer

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the shared rule
        run: pip install --quiet "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"

      - name: Read the public surface
        # No package dependencies: the surface is read with ast, so this stays cheap and
        # cannot be broken by optuna, hyperopt or an uninstalled sibling `wisent`
        # distribution. A module that does not parse fails the step rather than
        # silently shrinking the surface.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          declared="$(awk -F'"' '/version=/{print $2; exit}' setup.py)"
          echo "released: $released"
          echo "declared: $declared"

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$released" ]; then
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but setup.py still" \
                "declares the published version $released. The next version must be $required."
              false
            fi
            echo "The published version is still declared and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::setup.py declares $declared, but a $change change to" \
              "$released requires $required."
            false
          else
            echo "Declared version matches the $change change."
          fi

      - name: Verify the baseline is the artifact it claims to be
        # Checked on pull requests too, not only on main: a hand-edited baseline is
        # exactly the thing review should catch, and every comparison above is measured
        # against it.
        run: |
          set -euo pipefail
          # The first whitespace-delimited token of "source" is the provenance marker;
          # the rest is prose. A `pypi-` marker claims the registry serves that exact
          # version; any other marker claims the registry serves nothing at all. Both
          # directions are checked, because a baseline that stops describing a published
          # artifact -- in either direction -- makes the whole gate decorative.
          baseline="$(jq -r .version released-surface.json)"
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          echo "marker: $marker"

          case "$marker" in
            pypi-sdist:*|pypi-wheel:*) claims_registry=yes ;;
            stado:*|git-archive:*|head:*) claims_registry=no ;;
            *) echo "::error::unknown baseline provenance marker: $marker"; false ;;
          esac

          if [ "$claims_registry" = yes ]; then
            case "$marker" in
              *"$baseline"*) ;;
              *) echo "::error::the marker $marker does not name the baseline version" \
                   "$baseline, so the two disagree about what was recovered."; false ;;
            esac
            if ! curl -sSf "https://pypi.org/pypi/$PROJECT/$baseline/json" > /dev/null; then
              echo "::error::released-surface.json claims $marker, but PyPI does not serve" \
                "$PROJECT $baseline. The baseline was hand-edited; run scripts/baseline.py."
              false
            fi
            echo "PyPI serves the baseline $baseline, as the marker claims."

            # Honest about its tier is not the same as being on the best artifact. A
            # newer release, an sdist next to a wheel-only release, or a second pure
            # wheel for the same version can all appear after the baseline was
            # generated: every assertion above stays green while released-surface.json
            # quietly describes a superseded artifact, and the gate goes on measuring
            # the wrong bytes. So ask the generator what it would pick now.
            #
            # Only the version and the marker are compared. The regenerated SURFACE
            # must never reach a decision, and released-surface.json is never rewritten
            # here: recomputing both sides at check time is the one shape that is
            # structurally unable to refuse anything, and this must not be "simplified"
            # into it.
            #
            # The whole marker is compared, not just its tier prefix, because on a
            # registry tier the marker names one exact file and any other file is a
            # superseded baseline even when tier and version agree. Prefix-only
            # comparison is required on the head tier alone, whose sha moves with every
            # commit; this repository can never be on that tier, because PyPI serves it.
            # The probe costs one small download per run, which also proves the
            # published artifact still parses.
            best="$(python3 scripts/baseline.py --stdout)"
            best_marker="$(printf '%s' "$best" | jq -r '.source | split(" ") | first')"
            best_version="$(printf '%s' "$best" | jq -r .version)"
            if [ "$best_version" != "$baseline" ]; then
              echo "::error::the baseline describes $baseline, but $best_version is the" \
                "latest published version; run scripts/baseline.py."
              false
            fi
            if [ "$best_marker" != "$marker" ]; then
              echo "::error::the baseline names $marker, but the artifact to recover from" \
                "now is $best_marker; run scripts/baseline.py."
              false
            fi
            echo "$marker is still the best artifact available."
          else
            # This branch reads absence, so it must read a real ANSWER rather than the
            # failure of a request. Under `curl -sSf` a rate limit, an error page and a
            # permission refusal all fail exactly like not-found, and a reachability
            # control against another project does not help: it proves the registry is
            # up, not that this project's endpoint answered. A refused-permission reply
            # is a successful request whose answer means nothing at all.
            #
            # So demand testimony. PyPI states absence explicitly, as
            # {"message": "Not Found"}, and states presence by naming the project.
            # Three outcomes, not two: named -> published; stated absent -> honest; any
            # other body, including none -> unproven, refuse. `|| true` is safe only
            # because both passing branches require specific content and the fallthrough
            # refuses; it must never be lifted into a check that treats an empty answer
            # as agreement.
            #
            # The forward branch above needs none of this: there, any answer that is not
            # the artifact makes curl fail and the step refuse, which is already the safe
            # direction.
            answer="$(curl -s "https://pypi.org/pypi/$PROJECT/json" || true)"
            if printf '%s' "$answer" | jq -e '.info.name' > /dev/null; then
              echo "::error::released-surface.json claims nothing was published ($marker)," \
                "but PyPI names $PROJECT. The baseline is dodging a real release;" \
                "run scripts/baseline.py."
              false
            elif ! printf '%s' "$answer" |
                 jq -e '(.message // "") | ascii_downcase | contains("not found")' \
                 > /dev/null; then
              echo "::error::PyPI did not answer about $PROJECT, so its absence is" \
                "unproven. Refusing rather than assuming it is unpublished."
              false
            fi
            echo "PyPI states $PROJECT is not found, so an unpublished baseline is the" \
              "honest one."
          fi
