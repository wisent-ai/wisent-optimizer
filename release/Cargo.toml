[package]
name = "wisent-optimizer-release"
edition = "2021"
description = "The release contract of the wisent-optimizer Python package: its public surface and the baseline PyPI serves"
license = "MIT"
publish = false

[[bin]]
name = "wisent-optimizer-release"
path = "src/main.rs"

[dependencies]
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
